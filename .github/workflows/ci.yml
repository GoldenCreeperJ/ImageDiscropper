# CI：Windows / Linux / macOS 三平台 Debug——配置（vcpkg 清单模式）→ 构建（含 GUI）→ 测试。
# 平台级步骤（vcpkg 基线对齐 / vswhere / apt·brew 清单 / 长路径 / 日志收集）
# 集中在 _build-platform.yml 可复用工作流中，本文件只声明矩阵与触发条件。
name: CI

on:
  push:
    # 纯文档提交不触发（仅代码路径变化才触发）。
    paths:
      - 'ImageDiscropperCpp/**'
      - '.github/workflows/**'
  pull_request:

# 同一分支新 push 自动取消仍在运行的旧 run，避免并行重复烧配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # 稳定期 true：任一平台失败即取消其余进行中的平台（止损省时）；
      # 多平台调试期可临时改 false，一轮看全三个平台的失败信息。
      fail-fast: true
      matrix:
        include:
          - key: win-x64
            os: windows-latest
            configure: windows
            build: debug
            test: test-debug
          - key: linux-x64
            os: ubuntu-latest
            configure: linux-debug
            build: linux-debug
            test: test-linux-debug
          - key: macos-arm64
            os: macos-latest
            configure: macos-debug
            build: macos-debug
            test: test-macos-debug
    uses: ./.github/workflows/_build-platform.yml
    with:
      key: ${{ matrix.key }}
      os: ${{ matrix.os }}
      configure: ${{ matrix.configure }}
      build: ${{ matrix.build }}
      test: ${{ matrix.test }}
