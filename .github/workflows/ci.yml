# CI 通用分发入口：每 push / PR 先按变更路径定向，再把验证任务分发到对应实现。
# 分发规则（两层，filters 是定向的单一事实来源）：
#   · 触发层 paths = filters 的粗粒度超集——挡住纯无关 push，不产生空跑
#     （!**/*.md 排除全部文档：文档单独改动不触发 CI；文档随代码同改时仍经 shared 全测。
#      若需 SPEC 单独触发，在否定行之后补一行 'SPEC.md' 即可。）
#   · changes job 的 filters 精定向：实现路径 → 只测该实现；
#     共享契约（SPEC.md / .github/workflows/** / 根文档）→ 全实现都测（NFR-10）
# 接入新实现（tauri / wails / flutter / …）= 在本目录建同构文件（形态见 cpp-ci.yml：
# 矩阵 + cpp-build.yml 可复用构建工作流；命名约定 <impl>-ci / <impl>-cd / <impl>-build，
# GitHub 要求本地可复用工作流必须位于本目录顶层），然后：
#   1. 触发层 paths 与 filters 各加一行 <impl> 相关路径（两处同步！）
#   2. 加一个 job：
#        <impl>:
#          needs: changes
#          if: ${{ needs.changes.outputs.<impl> == 'true' || needs.changes.outputs.shared == 'true' }}
#          uses: ./.github/workflows/<impl>-ci.yml
# 本文件只声明触发条件与分发清单，不含任何平台细节。
name: CI

on:
  push:
    # 显式限定「仅分支推送」：标签推送根本不会进入本触发（发布由 cd.yml 负责），
    # 避免 paths 与 tags-ignore 组合过滤的边界行为。
    branches:
      - 'master'
    # 触发层 = filters 的粗粒度超集（挡住纯无关 push，避免空跑）；
    # 精细定向在 changes job 的 filters——新增实现目录/共享契约文件时两处同步。
    paths: &ci-paths
      - 'ImageDiscropperCpp/**'
      - 'ImageDiscropperRust/**'
      - '.github/**'
      - '!**/*.md'
  pull_request:
    paths: *ci-paths

permissions:
  contents: read
  pull-requests: read

# 同一分支新 push 自动取消仍在运行的旧 run，避免并行重复烧配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 路径定向：输出各实现 / 共享契约的变更布尔，供下游 job 的 if 消费。
  changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - 'ImageDiscropperCpp/**'
            rust:
              - 'ImageDiscropperRust/**'
            shared:
              - '.github/workflows/**'

  cpp:
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/cpp-ci.yml
