# CI：Windows / Linux / macOS 三平台——配置（vcpkg 清单模式）→ 构建（含 GUI）→ 测试。
# 依赖二进制经 vcpkg 的 GitHub Actions 缓存后端（x-gha）按平台复用：
# 每个平台首次运行从源码构建 qtbase 等依赖较慢（约 30-60 分钟），之后每次运行直接取缓存。
name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg environment
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        working-directory: ImageDiscropperCpp
        run: cmake --preset windows

      - name: Build
        working-directory: ImageDiscropperCpp
        run: cmake --build --preset debug

      - name: Test
        working-directory: ImageDiscropperCpp
        run: ctest --preset test-debug

  build-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg environment
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      # qtbase 在 Linux 上构建需系统 X11/EGL/字体等开发库（vcpkg 官方 Qt 依赖清单）。
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev

      - name: Configure
        working-directory: ImageDiscropperCpp
        run: cmake --preset linux-debug

      - name: Build
        working-directory: ImageDiscropperCpp
        run: cmake --build --preset linux-debug

      - name: Test
        working-directory: ImageDiscropperCpp
        run: ctest --preset test-linux-debug

  build-macos:
    runs-on: macos-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg environment
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: ImageDiscropperCpp
        run: cmake --preset macos-debug

      - name: Build
        working-directory: ImageDiscropperCpp
        run: cmake --build --preset macos-debug

      - name: Test
        working-directory: ImageDiscropperCpp
        run: ctest --preset test-macos-debug
