# CI：每 push / PR——三平台 Release 构建（静态 Qt，与发布产物同构）+ 全套测试。
# 与 CD 共用 release 预设与 vcpkg 缓存：CI 负责写入缓存，CD 命中复用（发版分钟级）。
# 三平台 Debug GUI 验证见 dbg-verify.yml（手动触发，不写缓存）。
# 平台级步骤集中在 _build-platform.yml 可复用工作流中，本文件只声明矩阵与触发条件。
name: CI

on:
  push:
    # 显式限定「仅分支推送」：标签推送根本不会进入本触发（发布由 cd.yml 负责），
    # 避免 paths 与 tags-ignore 组合过滤的边界行为。
    branches:
      - '**'
    # 纯文档提交不触发（仅代码路径变化才触发）。
    paths:
      - 'ImageDiscropperCpp/**'
      - '.github/workflows/**'
  pull_request:

# 同一分支新 push 自动取消仍在运行的旧 run，避免并行重复烧配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # 稳定期 true：任一平台失败即取消其余进行中的平台（止损省时）；
      # 多平台调试期可临时改 false，一轮看全三个平台的失败信息。
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: linux-release
          - os: macos-latest
            preset: macos-release
    uses: ./.github/workflows/_build-platform.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
