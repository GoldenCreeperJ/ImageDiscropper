# CI 通用分发入口：每 push / PR 先按变更路径定向，再把验证任务分发到对应实现。
# 分发规则（filters 是定向的单一事实来源）：
#   · 触发层 paths = filters 的粗粒度超集——挡住纯无关 push，不产生空跑（!**/*.md 排除文档单独改动）。
#   · changes job 的 filters 精定向：实现路径 → 只测该实现；共享契约（.github/workflows/**）→ 全实现都测（NFR-10）。
#   · 图标构建 + 产物上传（icons-ci）无条件每次跑：产出 icon-products 供构建腿下载落地，
#     icons 失败则下游 needs 腿被跳过（闸门语义）。
# 接入新实现（tauri / wails / flutter / …）：在本目录建同构 <impl>-ci.yml（形态见 cpp-ci.yml：
# 矩阵 + cpp-build.yml 可复用构建；GitHub 要求本地可复用工作流须位于本目录顶层），
# paths 与 filters 各加一行 <impl> 路径（两处同步），再加一个 needs changes 的分发 job。
# 本文件只声明触发条件与分发清单，不含任何平台细节。
name: CI

on:
  push:
    # 显式限定「仅分支推送」：标签推送根本不会进入本触发（发布由 cd.yml 负责），
    # 避免 paths 与 tags-ignore 组合过滤的边界行为。
    branches:
      - 'master'
    # 触发层 = filters 的粗粒度超集（挡住纯无关 push，避免空跑）；
    # 精细定向在 changes job 的 filters——新增实现目录/共享契约文件时两处同步。
    paths: &ci-paths
      - 'ImageDiscropperCpp/**'
      - 'ImageDiscropperRust/**'
      - 'assets/**'
      - '.github/**'
      - '!**/*.md'
  pull_request:
    paths: *ci-paths

permissions:
  contents: read
  pull-requests: read

# 同一分支新 push 自动取消仍在运行的旧 run，避免并行重复烧配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 路径定向：输出各实现 / 共享契约的变更布尔，供下游 job 的 if 消费。
  changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpp:
              - 'ImageDiscropperCpp/**'
            rust:
              - 'ImageDiscropperRust/**'
            shared:
              - '.github/workflows/**'

  # 图标构建 + 产物上传（icon-products）：无条件每次跑、无 needs，与 changes 并行
  # （矩阵腿需等它的产物，故实际在腿前完成）。
  icons:
    uses: ./.github/workflows/icons-ci.yml

  cpp:
    # needs icons：构建腿消费 icon-products 产物（腿内 download-artifact 落地）；
    # icons 失败则本 job 被跳过（闸门语义）。代价是腿启动延后图标构建的 ~2-3 分钟。
    needs: [changes, icons]
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/cpp-ci.yml
