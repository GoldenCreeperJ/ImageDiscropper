# CI：每 push——Windows 构建 GUI + 测试；Linux/macOS 只构建 Core/CLI + 测试（不装 Qt，分钟级）。
# 三平台 GUI 完整验证见 gui-verify.yml。
# 平台级步骤（vcpkg 基线对齐 / vswhere / apt·brew 清单 / 长路径 / 日志收集）
# 集中在 _build-platform.yml 可复用工作流中，本文件只声明矩阵与触发条件。
name: CI

on:
  push:
    # 显式限定「仅分支推送」：标签推送根本不会进入本触发（发布由 cd.yml 负责），
    # 避免 paths 与 tags-ignore 组合过滤的边界行为。
    branches:
      - '**'
    # 纯文档提交不触发（仅代码路径变化才触发）。
    paths:
      - 'ImageDiscropperCpp/**'
      - '.github/workflows/**'
  pull_request:

# 同一分支新 push 自动取消仍在运行的旧 run，避免并行重复烧配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # 稳定期 true：任一平台失败即取消其余进行中的平台（止损省时）；
      # 多平台调试期可临时改 false，一轮看全三个平台的失败信息。
      fail-fast: false
      matrix:
        include:
          - key: win-x64
            os: windows-latest
            preset: windows
            vcpkg-installed: D:/vcpkg_installed
            vcpkg-downloads: D:/vcpkg-src/downloads
            cmake-args: ''
          - key: linux-x64
            os: ubuntu-latest
            preset: linux-debug
            vcpkg-installed: ImageDiscropperCpp/build/linux-debug/vcpkg_installed
            vcpkg-downloads: vcpkg-src/downloads
            cmake-args: ''
          - key: macos-arm64
            os: macos-latest
            preset: macos-debug
            vcpkg-installed: ImageDiscropperCpp/build/macos-debug/vcpkg_installed
            vcpkg-downloads: vcpkg-src/downloads
            cmake-args: ''
    uses: ./.github/workflows/_build-platform.yml
    with:
      key: ${{ matrix.key }}
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      vcpkg-installed: ${{ matrix.vcpkg-installed }}
      vcpkg-downloads: ${{ matrix.vcpkg-downloads }}
      cmake-args: ${{ matrix.cmake-args }}
