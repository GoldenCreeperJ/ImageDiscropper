# C++ 实现的 CI 入口：五腿矩阵（桌面三平台 + 移动双端）→ cpp-build.yml。
# 移动腿不跑 ctest（交叉编译产物无法在构建机执行）；依赖树缓存命中后分钟级。
# 由通用分发入口 ci.yml 调用；未来其他语言实现（rust/tauri/wails/flutter 等）
# 在各自目录建同构入口（<impl>/ci.yml），行为契约见 SPEC §8 与 NFR-10。
name: cpp-ci

on:
  workflow_call:

jobs:
  build:
    strategy:
      # 稳定期 true：任一平台失败即取消其余进行中的平台（止损省时）；
      # 多平台调试期可临时改 false，一轮看全五个平台的失败信息。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: linux-release
          - os: macos-latest
            preset: macos-release
          - os: ubuntu-latest
            preset: android
          - os: macos-latest
            preset: ios
    uses: ./.github/workflows/cpp-build.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
