# C++ 实现的 CI 入口：五腿矩阵（桌面三平台 + 移动双端）→ cpp-build.yml。
# 移动腿不跑 ctest（交叉编译产物无法在构建机执行）；依赖树缓存命中后分钟级。
# 由通用分发入口 ci.yml 调用；新语言实现按同构在本目录顶层建 <impl>-ci.yml 接回。
name: cpp-ci

on:
  workflow_call:

jobs:
  build:
    strategy:
      # false：矩阵五平台并行、互不取消，一轮看全各平台的失败信息。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: linux-release
          - os: macos-latest
            preset: macos-release
          - os: ubuntu-latest
            preset: android-release
          - os: macos-latest
            preset: ios-release
    uses: ./.github/workflows/cpp-build.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
