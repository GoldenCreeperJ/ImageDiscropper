# C++ 实现的可复用构建工作流：单腿「环境准备 → 配置 → 构建 →（测试）→（打包）」。
# 桌面与移动统一于此：Linux 桌面腿与 Android 腿共享 ubuntu 环境与依赖清单，
# macOS 桌面腿与 iOS 腿共享 macos 环境与工具链——差异点只有三处，按 preset 前缀分支：
#   · Android SDK（android-* 腿）
#   · 测试（交叉编译产物无法在构建机执行：android-*/ios-* 腿按 preset 前缀自动跳过）
#   · 打包形态（desktop：dist 拷贝 + 安装包；android-*：APK；ios-*：app zip）
# 由 cpp-ci.yml（5 腿矩阵）、cpp-cd.yml（发布路由）、cpp-dbg-verify.yml 与
# cpp-mobile-verify.yml 调用。
name: cpp-build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      preset:
        required: true
        type: string        # configure 预设名（二进制目录约定为 build/<preset>）
      cache-deps:
        required: false
        type: boolean
        default: true       # 整树缓存 vcpkg_installed（ci/cd 开；dbg-verify/mobile-verify 关）
      prepare-dist:
        required: false
        type: boolean
        default: false      # true：整理 dist 产物并上传（发布用）
      ref:
        required: false
        type: string
        default: ''         # 发布手动触发时传入标签名；空则用触发本次运行的 ref

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      # 现场克隆钉死基线的 vcpkg（不依赖 runner 镜像自带的 vcpkg：版本随镜像漂移、
      # 且带不可丢弃的镜像补丁）；基线 SHA 与 vcpkg.json 的 builtin-baseline 同步维护。
      - name: Set up vcpkg
        shell: bash
        run: |
          DEST="${{ runner.os == 'Windows' && 'D:/vcpkg-src' || format('{0}/vcpkg-src', github.workspace) }}"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$DEST"
          git -C "$DEST" fetch --depth 1 origin e6f9e70a29a3e80a1fc510d8503304315447112f
          git -C "$DEST" checkout --detach e6f9e70a29a3e80a1fc510d8503304315447112f
          echo "VCPKG_ROOT=$DEST" >> "$GITHUB_ENV"

      # 二进制缓存：整树 restore（命中则 vcpkg 跳过已装包；未命中则 job 结束自动 save）。
      # 不缓存 downloads：downloads 只在 binary 未命中的冷构建里被消费，而命中轮次里
      # 恢复它是纯开销（白解压 ~1G）且与 binary 条目 LRU 权重相同——冷构建属低频事件，
      # 偶发下载失败重跑即可，不需要常驻 0.9G 的保险条目。
      # 弃用原因备注：x-gha 后端已被新版 vcpkg 移除；nuget,github 在该版本下
      # 源解析失效且非 Windows 需 mono（runner 屏蔽 keyserver），故退回 actions/cache 整树方案。
      # key 含 preset（ci 与 cd 同为 release 预设共享同一条目）与 triplet 哈希
      # （改 triplet 即自动换 key）；Debug 树（dbg-verify）不写缓存。
      - name: Restore vcpkg binary cache
        if: inputs.cache-deps
        uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'Windows' && 'D:/vcpkg_installed' || format('ImageDiscropperCpp/build/{0}/vcpkg_installed', inputs.preset) }}
          key: vcpkg-${{ runner.os }}-${{ inputs.preset }}-baseline-e6f9e70a29-${{ hashFiles('ImageDiscropperCpp/vcpkg.json', 'ImageDiscropperCpp/triplets/*.cmake') }}

      # Android SDK + NDK（runner 无预装完整 SDK）。ANDROID_NDK_ROOT 被 android 预设引用。
      # v4+：v3 起 SDK 仓库下架了 legacy tools 包，v3 默认安装 'tools' 必失败。
      - name: Set up Android SDK
        if: startsWith(inputs.preset, 'android')
        uses: android-actions/setup-android@v4

      # Qt 的安卓宏（Qt6AndroidMacros）把 ANDROID_SDK_ROOT 当纯 CMake 变量读
      # （全文件无 $ENV 回退），而 CMake 不会自动导入环境变量——需预设经 $env{}
      # 映射成缓存变量；本步骤保证该 env 恒非空（setup-android 与 runner 镜像
      # 可能只设 ANDROID_HOME，用其兜底）。导出经 GITHUB_ENV 对后续 configure
      # 与 androiddeployqt 打包步骤同样可见。
      - name: Export Android SDK root
        if: startsWith(inputs.preset, 'android')
        shell: bash
        run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      # qtbase 显式特性清单（gui/thread/widgets + xcb 家族/egl/fontconfig/xrender；QtCore 为
      # 端口基座恒构建、不可作为特性请求）的系统库依赖：
      # xcb/xkbcommon/EGL/GL 经 pkg-config 消费系统开发库（vcpkg 官方 Ubuntu 清单）；
      # fontconfig 仍从源码经 autotools 构建（vcpkg 内用 gperf 生成器），需 autoconf 全家桶与 libltdl；
      # dbus 已随 default-features:false 移除，不再需要 libdbus-1-dev。
      # macOS 只需 autoconf 全家桶 + ninja。Android 腿跑在 ubuntu 上，共享此清单。
      - name: Install build dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config ninja-build \
              autoconf autoconf-archive automake libtool libltdl-dev \
              libx11-dev libx11-xcb-dev libxext-dev libxrender-dev libxi-dev \
              libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
              libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
              libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
              libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
              libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev \
              libxcb-composite0-dev libxcb-damage0-dev libxcb-dri2-0-dev \
              libxcb-dri3-dev libxcb-present-dev libxcb-record0-dev \
              libxcb-res0-dev libxcb-screensaver0-dev libxcb-xtest0-dev \
              libxcb-xv0-dev libxcb-xvmc0-dev \
              libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
              libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
              libsm-dev libice-dev
          else
            brew install autoconf autoconf-archive automake libtool ninja
          fi

      # 配置与构建（Windows 单独一步：Ninja 预设不绑定特定 VS 版本，经 vswhere 定位最新
      # VS 并用 VsDevCmd 注入 MSVC 环境——PATH 里另有 MinGW 时 Ninja 默认会误选，必须显式限定）。
      # 先启用长路径策略：qtbase 构建树层级很深（uiautomation 插件），超 260 字符报 C1083；
      # 根治在 preset 的 VCPKG_INSTALLED_DIR=D:/vcpkg_installed，此处作双保险。
      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ImageDiscropperCpp
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake --preset ${{ inputs.preset }}
          cmake --build build/${{ inputs.preset }}

      - name: Configure and build (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ImageDiscropperCpp
        run: |
          cmake --preset ${{ inputs.preset }}
          cmake --build build/${{ inputs.preset }}

      # 测试：桌面腿跑（Release 预设已默认构建测试目标——见根 CMakeLists 的
      # IDC_BUILD_TESTS）；移动腿按 preset 前缀自动跳过（交叉编译产物无法在构建机执行）。
      - name: Test
        if: ${{ !startsWith(inputs.preset, 'android') && !startsWith(inputs.preset, 'ios') }}
        working-directory: ImageDiscropperCpp
        run: ctest --test-dir build/${{ inputs.preset }} --output-on-failure

      # ---- 桌面发布产物（CI 不启用） ----
      # Windows/Linux 直接拷贝裸可执行文件；macOS 的 idc_gui 以 .app 捆绑包输出
      #（打包为 zip 分发——release job 的提平步骤只处理文件，目录会被拆散），
      # 并额外校验二进制无「系统路径之外」的动态依赖（qtbase port 在非 Windows
      # 强制静态，此处防坏产物混入——检测到即失败）。
      - name: Prepare dist artifacts
        if: ${{ inputs.prepare-dist && !startsWith(inputs.preset, 'android') && !startsWith(inputs.preset, 'ios') }}
        shell: bash
        run: |
          BIN="ImageDiscropperCpp/build/${{ inputs.preset }}/bin"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BIN/idc_gui.exe" "dist/idc_gui-${{ inputs.preset }}.exe"
            cp "$BIN/idc.exe" "dist/idc-${{ inputs.preset }}.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$BIN/idc_gui.app" "dist/idc_gui-${{ inputs.preset }}.app"
            cp "$BIN/idc" "dist/idc-${{ inputs.preset }}"
            check() {
              if otool -L "$1" | tail -n +2 | awk '{print $1}' | grep -vE "^/(usr/lib|System/Library)" | grep -q .; then
                echo "::error::$1 存在非系统动态依赖，裸二进制不可分发；需引入 macdeployqt 打包"
                exit 1
              fi
            }
            check "dist/idc_gui-${{ inputs.preset }}.app/Contents/MacOS/idc_gui"
            check "dist/idc-${{ inputs.preset }}"
            (cd dist && zip -qr "idc_gui-${{ inputs.preset }}.app.zip" "idc_gui-${{ inputs.preset }}.app" && rm -rf "idc_gui-${{ inputs.preset }}.app")
          else
            cp "$BIN/idc_gui" "dist/idc_gui-${{ inputs.preset }}"
            cp "$BIN/idc" "dist/idc-${{ inputs.preset }}"
          fi

      # Windows 安装包：Inno Setup（choco 安装）把 GUI + CLI 两个 exe 打成安装器
      #（安装/快捷方式/卸载器见 ImageDiscropperCpp/packaging/installer.iss，无自定义图标）。
      - name: Build Windows installer (Inno Setup)
        if: inputs.prepare-dist && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          Copy-Item "ImageDiscropperCpp/build/${{ inputs.preset }}/bin/idc_gui.exe" dist/installer/idc_gui.exe
          Copy-Item "ImageDiscropperCpp/build/${{ inputs.preset }}/bin/idc.exe" dist/installer/idc.exe
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSRC=$env:GITHUB_WORKSPACE\dist\installer" "/O$env:GITHUB_WORKSPACE\dist" "$env:GITHUB_WORKSPACE\ImageDiscropperCpp\packaging\installer.iss" | Out-Null
          Move-Item "dist\ImageDiscropper-setup.exe" "dist\ImageDiscropper-setup-win-x64.exe"

      # ---- 移动打包（Android：qt_finalize_target 的 ninja 步骤已出 APK；iOS：zip .app） ----
      # Qt 的 Android 目标在 cmake --build 末尾自动执行 androiddeployqt（ninja 规则
      # "Creating APK"），APK 与部署设置 json 均生成在目标所在子目录
      # build/<preset>/ImageDiscropperGui/ 下——此处只搬运改名，不再二次调用
      # androiddeployqt（旧 gradle 路径约定已随 qt_finalize_target 方案作废）。
      # 注意：release 构建产出未签名 APK（alpha 分发前需补签名配置，后续处理）。
      - name: Package APK
        if: startsWith(inputs.preset, 'android')
        run: |
          mkdir -p dist
          cp ImageDiscropperCpp/build/${{ inputs.preset }}/ImageDiscropperGui/android-build/idc_gui.apk \
             dist/idc_gui-android-arm64.apk

      - name: Upload APK
        if: startsWith(inputs.preset, 'android')
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.preset }}
          path: dist/idc_gui-android-arm64.apk
          if-no-files-found: error

      - name: Package app bundle
        if: startsWith(inputs.preset, 'ios')
        run: |
          mkdir -p dist
          cp -R ImageDiscropperCpp/build/${{ inputs.preset }}/bin/idc_gui.app dist/idc_gui-ios.app
          (cd dist && zip -qr idc_gui-ios.app.zip idc_gui-ios.app && rm -rf idc_gui-ios.app)

      - name: Upload iOS app
        if: startsWith(inputs.preset, 'ios')
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.preset }}
          path: dist/idc_gui-ios.app.zip
          if-no-files-found: error

      - name: Upload dist artifacts
        if: inputs.prepare-dist && success()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.preset }}
          path: dist/*
          if-no-files-found: error

      # Windows 的 VCPKG_INSTALLED_DIR=D:/vcpkg_installed 在工作区外，artifact 无法直接上传；
      # 失败时先把端口构建日志拷回工作区再上传。
      - name: Collect vcpkg logs on failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ImageDiscropperCpp/build/vcpkg-logs | Out-Null
          Copy-Item "D:/vcpkg_installed/vcpkg/blds/*/install-*-out.log" ImageDiscropperCpp/build/vcpkg-logs/ -ErrorAction SilentlyContinue

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ inputs.preset }}
          path: |
            ImageDiscropperCpp/build/*/vcpkg-manifest-install.log
            ImageDiscropperCpp/build/*/vcpkg_installed/vcpkg/blds/**/install-*-out.log
            ImageDiscropperCpp/build/vcpkg-logs/
          if-no-files-found: ignore

      # 缓存瘦身：清单模式下 buildtrees 内嵌于 vcpkg_installed/vcpkg/blds 且无法配置
      # 迁出（VCPKG_BUILDTREES_DIR 在工具链与 vcpkg-tool 中均已无实现）。缓存前删除：
      # 已安装状态由 vcpkg/status + vcpkg/info 记录，命中轮次不触碰 blds；
      # 个别包需重建时 vcpkg 会现场重建其 buildtree。必须置于日志收集步骤之后。
      - name: Trim buildtrees before cache save
        if: inputs.cache-deps
        shell: bash
        run: rm -rf "${{ runner.os == 'Windows' && 'D:/vcpkg_installed' || format('ImageDiscropperCpp/build/{0}/vcpkg_installed', inputs.preset) }}/vcpkg/blds"
