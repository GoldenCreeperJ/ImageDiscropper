# 发布统一入口：打 v* 标签或手动触发，按标签名路由：
#   · v*-alpha* / v*-beta* → 预发布（prerelease=true → 各实现的预发布产物）
#   · 其余 v*            → 正式发布（prerelease=false → 各实现的正式产物）
# 本文件只持有「标签策略 + 实现选择 + 产物收集约定」；各实现的发布细节（构建矩阵、
# 缓存、打包、移动产物）全部在各自的 <impl>-cd.yml / <impl>-build.yml（见 cpp-cd.yml）。
# 接入新实现（tauri/wails/flutter/…）= 建 <impl>-cd.yml，在此加一个 job + 一个 dispatch 布尔输入。
# 产物收集约定：所有发布物 artifact 命名以 dist-* 开头。
# 注意：手动触发时至少选择一个实现（全不选会产出空 Release，SHA256SUMS 步骤会失败）。
#
# 说明：
#   · 手动触发（workflow_dispatch）填写标签名（如 v1.0.1 / v1.0.1-alpha.1）；
#     标签不存在时由 prepare job 在当前默认分支 HEAD 上创建并推送。
#     推 tag 不会自触发本工作流：工作流内经 GITHUB_TOKEN 的 push 事件被 GitHub 抑制。
#   · 先建标、后按标构建：保证 tag 精确指向所构建的提交。
#   · 产物未做代码签名（Windows SmartScreen 会提示、macOS 首次打开需右键），后续可加。
name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.1 或 v1.0.1-alpha.1；不存在时会在当前 HEAD 自动创建）'
        required: true
        type: string
      # 产物范围覆盖：默认 all = 当前恒全平台；移动端未验收时
      # 可手动收窄为 desktop（正式/预发布通用）。
      scope:
        description: '产物范围覆盖'
        required: false
        type: choice
        default: all
        options:
          - desktop
          - mobile
          - all
      # 手动发布可选实现（tag push 触发时无输入、恒为全量）。
      # 新实现接入时按同模式追加一个 boolean 输入 + 对应 job 的 if。
      build-cpp:
        description: '构建并发布 C++ 实现'
        required: false
        type: boolean
        default: true


permissions:
  contents: write

# 同一标签的重复触发互斥（防手滑二次触发）；不同标签的发布互不影响。
# 手动触发时 github.ref 是默认分支，故用 inputs.tag 参与分组。
concurrency:
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 手动触发时若标签不存在：在当前默认分支 HEAD 上创建并推送该标签
  # （打标即「此刻的 main 就是要发布的版本」）。tag push 触发的运行跳过本 job。
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Create tag if missing
        run: |
          # 存在性检查必须问远端：prepare 是浅克隆（fetch-depth 1），远端 tag
          # 指向未拉取的提交时 rev-parse 在本地查不到，会误判为不存在并尝试
          # 重建推送 → 远端拒绝 "already exists"。ls-remote 直接查询远端，恒准确。
          if git ls-remote --exit-code origin "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "标签 ${{ inputs.tag }} 已存在，跳过创建"
          else
            git tag "${{ inputs.tag }}"
            git push origin "refs/tags/${{ inputs.tag }}"
            echo "已创建标签 ${{ inputs.tag }}（指向当前 HEAD）"
          fi

  # 各实现的发布入口（新实现在此追加：job + dispatch 布尔输入）。
  # 标签路由在下方 with 中现算：prerelease = Release 类型；scope = 产物范围。
  #   · v* / v*-alpha* / v*-beta* → scope 默认 all（发布即全平台，移动端与桌面平权）
  #   · 手动触发可选 scope 覆盖（如移动端未验收时收窄为 desktop）
  #   · v*-rc*（预留）→ 桌面候选版：在 scope 表达式中加 rc 分支即得
  cpp:
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build-cpp }}
    uses: ./.github/workflows/cpp-cd.yml
    secrets: inherit   # Android 签名密钥经两层可复用工作流传递（secrets 不自动继承）
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-alpha') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-beta') }}
      scope: ${{ github.event_name != 'workflow_dispatch' && 'all' || inputs.scope }}

  release:
    needs: [cpp]
    runs-on: ubuntu-latest
    steps:
      # 全量历史 + 标签：release note 生成需要两次标签间的提交记录
      #（本 job 默认无 checkout，其余步骤只处理 artifact）。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist

      - name: Flatten and compute checksums
        run: |
          # 防御 download-artifact 新版本的嵌套行为：把子目录里的文件提平。
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv -f {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          cd dist
          sha256sum * > SHA256SUMS

      # 按 conventional commit 前缀分组生成中文 release note（直推 master 的工作流
      # 没有 PR 可解析，GitHub 原生生成器只剩一行 Full Changelog——故自产）。
      - name: Generate release notes from commits
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..$TAG}"
          [ -z "$RANGE" ] && RANGE="$TAG"
          emit() {
            local items
            items=$(git log --pretty=format:"%s" "$RANGE" | grep -E "^$2" || true)
            if [ -n "$items" ]; then
              echo "### $1" >> release-notes.md
              echo "$items" | sed -E 's/^(feat|fix|refactor|build|ci|docs|test|chore|perf|style)(\([^)]*\))?: ?/- /' >> release-notes.md
              echo "" >> release-notes.md
            fi
          }
          : > release-notes.md
          echo "## 变更" >> release-notes.md
          emit "新功能" "feat"
          emit "修复" "fix"
          emit "重构" "refactor"
          emit "构建与发布" "build|ci"
          emit "文档" "docs"
          emit "其他" "test|chore|perf|style"
          if [ -n "$PREV" ]; then
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...${TAG}" >> release-notes.md
          fi

      # 同名 tag 重新发布时保留既有 notes（可能含手工编辑），仅新建 release 才
      # 写入本次生成的变更清单。gh 在 runner 上预装且经 GITHUB_TOKEN 自动认证。
      - name: Finalize release notes (preserve existing on re-publish)
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes-final.md 2>/dev/null \
             && [ -s release-notes-final.md ]; then
            echo "release 已存在：保留既有 notes"
          else
            cp release-notes.md release-notes-final.md
          fi

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-alpha') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-beta') }}
          body_path: release-notes-final.md
          files: |
            dist/*
