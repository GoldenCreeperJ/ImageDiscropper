# C++ 手动验证入口（workflow_dispatch 触发）：日常 CI 只跑 Release（与发布产物同构），
# 本工作流按需补齐 Debug 验证——桌面三平台（跑 ctest）+ 移动双端（交叉编译产物无法在
# 构建机执行测试，只构建打包）；不写缓存（避免挤占 10GB 池）。
# 构建与打包细节见 cpp-build.yml；本文件只声明触发条件与矩阵。
name: cpp-verify

on:
  workflow_dispatch:

concurrency:
  group: cpp-verify
  cancel-in-progress: true

jobs:
  # 图标产物生产者：派生物不入库，验证腿的图标唯一来源是 icon-products 产物。
  icons:
    uses: ./.github/workflows/icons-ci.yml

  debug-all:
    needs: icons
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: ubuntu-latest
            preset: linux-debug
          - os: macos-latest
            preset: macos-debug
          - os: ubuntu-latest
            preset: android-debug
          - os: macos-latest
            preset: ios-debug
    uses: ./.github/workflows/cpp-build.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      cache-deps: false   # 纯验证：只读不写缓存
